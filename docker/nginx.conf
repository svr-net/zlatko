# Static hosting of the web front end. The default mime.types already maps .wasm to
# application/wasm, which WebAssembly.instantiateStreaming requires.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/wasm application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # The WASM module is rebuilt with the page code; revalidate rather than cache blindly.
    location ~* \.(js|wasm|css|html)$ {
        add_header Cache-Control "no-cache";
    }
}
