name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep in step with the Dockerfile ARGs. (Job container images cannot read env, so the
# emsdk and Playwright image tags below repeat these versions.)
env:
  EMSDK_VERSION: 4.0.10
  PLAYWRIGHT_VERSION: 1.56.1
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------- native C++ library
  native:
    name: native (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Example program
        run: ./build/counterparty_exposure_demo

  sanitizers:
    name: native (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build with sanitizers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCCR_BUILD_EXAMPLES=OFF \
            -DCMAKE_CXX_FLAGS="-O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -D_GLIBCXX_ASSERTIONS"
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------- WebAssembly module
  wasm:
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:4.0.10
    steps:
      - uses: actions/checkout@v4
      - name: Build the Embind module
        run: |
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j"$(nproc)"
      - name: Check every entry point (Node)
        run: node web/tests/wasm.test.mjs
      - name: Committed web/wasm matches the sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- web/wasm; then
            echo "::error::web/wasm/ccr.{js,wasm} are out of date. Rebuild them (docker build --target wasm-artifacts --output web/wasm .) and commit."
            git diff --stat -- web/wasm
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: web/wasm/
          if-no-files-found: error

  # ---------------------------------------------------------------- standalone site
  standalone:
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: web/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/standalone/package-lock.json
      - name: Build
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          npm --prefix tools/standalone ci --no-audit --no-fund
          node tools/standalone/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zlatko-ccr-standalone
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------- browser end-to-end tests
  e2e:
    needs: [wasm, standalone]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: web/wasm
      - uses: actions/download-artifact@v4
        with:
          name: zlatko-ccr-standalone
          path: dist
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@${{ env.PLAYWRIGHT_VERSION }}
      - name: Development site over HTTP
        run: mkdir -p screenshots/dev && SCREENSHOTS="$GITHUB_WORKSPACE/screenshots/dev" node web/tests/e2e.mjs
      - name: Standalone build from file:// (no server, no network)
        run: mkdir -p screenshots/file && SCREENSHOTS="$GITHUB_WORKSPACE/screenshots/file" node web/tests/e2e.mjs --root dist/standalone --file
      - name: Standalone build over HTTP
        run: mkdir -p screenshots/http && SCREENSHOTS="$GITHUB_WORKSPACE/screenshots/http" node web/tests/e2e.mjs --root dist/standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: screenshots/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Docker images
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Native image (build + ctest)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: native
          tags: zlatko-ccr:native
          load: true
          cache-from: type=gha,scope=native
          cache-to: type=gha,scope=native,mode=max
      - name: Web image (WASM from source + standalone site on nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          tags: zlatko-ccr:ci
          load: true
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Smoke-test the web image
        run: |
          docker run -d --name ccr-web -p 8080:80 zlatko-ccr:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/index.html | grep -q 'data-page="index"'
          curl -fsS http://127.0.0.1:8080/manifest.json | grep -q '"name": "zlatko-ccr-standalone"'
          docker run --rm zlatko-ccr:native ccr_tests
