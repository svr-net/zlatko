# Temporary (removed by the next commit): rebuilds web/wasm for this branch in the same pinned
# Emscripten image as the CI `wasm` job, checks it, and commits it to the branch.
name: Rebuild web/wasm (temporary)

on:
  push:
    branches: [adaptive-nested-monte-carlo]
    paths: ['.github/workflows/rebuild-wasm.yml']

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:4.0.10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-nested-monte-carlo
      - name: Build the Embind module
        run: |
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j"$(nproc)"
      - name: Check every entry point (Node)
        run: node web/tests/wasm.test.mjs && node web/tests/ai.test.mjs
      - name: Commit web/wasm
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/wasm
          git commit -m "Rebuild web/wasm (emscripten/emsdk:4.0.10)"
          git push origin HEAD:adaptive-nested-monte-carlo
